version: 2
updates:
  # Action versions are a supply-chain surface; keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  # Bun, not npm: the lockfile is bun.lock and there is no package-lock.json
  # for the npm updater to resolve against.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development
