name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `secrets` cannot be referenced from a job-level `if`, so surface its
    # presence as an env var and gate the steps on that. Without this the job
    # would fail red on every PR until the secret is configured.
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Report missing credential
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: |
          echo "::notice title=Claude review skipped::Set the ANTHROPIC_API_KEY repository secret (or switch this workflow to claude_code_oauth_token) to enable automated review."

      - uses: actions/checkout@v6
        if: env.HAS_ANTHROPIC_KEY == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_ANTHROPIC_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action only starts the inline-comment MCP server when
          # --allowedTools names it, even though the skill's own frontmatter does.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
