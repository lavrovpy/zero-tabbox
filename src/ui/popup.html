<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>zero-tabbox</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body class="popup">
    <!--
      tasks.md 6.1. The popup shows exactly three things: the next cutoff (with
      minutes remaining), "End day now", and the settings gear. Nothing else
      may be added — not even read-only stats, which live on the options page
      (sweep-controls.spec "No softening controls" / "Settings surface").
    -->
    <main class="stack">
      <header class="stack-tight" aria-live="polite">
        <p class="eyebrow">Next cutoff</p>
        <p class="headline" id="next-cutoff-time">--:--</p>
        <p class="muted" id="next-cutoff-eta">Checking the schedule…</p>
      </header>

      <button id="end-day-now" class="btn btn-destructive btn-block" type="button">
        End day now
      </button>

      <hr class="divider" />

      <footer class="row-end">
        <a id="open-options" class="icon-link" href="#" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
